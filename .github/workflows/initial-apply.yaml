name: Initial Apply

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  
  initial-apply:
    environment: dev
    name: Initial Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Terraform Init VPC
        working-directory: ./vpc
        run: terraform init -backend=false
      - name: Terraform Validate VPC
        working-directory: ./vpc
        run: terraform validate
      - name: Terraform Check VPC
        working-directory: ./vpc
        run: terraform fmt -check -recursive
      - name: Terraform Init EKS
        working-directory: ./eks
        run: terraform init -backend=false
      - name: Terraform Validate EKS
        working-directory: ./eks
        run: terraform validate
      - name: Terraform Check EKS
        working-directory: ./eks
        run: terraform fmt -check -recursive
      - name: Terraform Init RDS
        working-directory: ./rds
        run: terraform init -backend=false
      - name: Terraform Validate RDS
        working-directory: ./rds
        run: terraform validate
      - name: Terraform Check RDS
        working-directory: ./rds
        run: terraform fmt -check -recursive
      - name: Terraform Init Addons
        working-directory: ./addons
        run: terraform init -backend=false
      - name: Terraform Validate Addons
        working-directory: ./addons
        run: terraform validate
      - name: Terraform Check Addons
        working-directory: ./addons
        run: terraform fmt -check -recursive
      - name: Terraform Apply VPC
        working-directory: ./vpc
        run: terraform apply -auto-approve -var-file=./environment/dev.tfvars
      - name: Terraform Apply EKS
        working-directory: ./eks
        run: terraform apply -auto-approve -var-file=./environment/dev.tfvars
      - name: Terraform Apply RDS
        working-directory: ./rds
        run: terraform apply -auto-approve -var="db_username=${{ secrets.DB_USERNAME }}" -var-file=./environment/dev.tfvars
      - name: Terraform Apply Addons
        working-directory: ./addons
        run: terraform apply -auto-approve -var-file=./environment/dev.tfvars