name: Terraform Scan and Apply

on:
  pull_request: 
  push: 
    branches:
      - main

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  TF_DIR: "vpc eks rds addons"


permissions:
  contents: read
  id-token: write
  actions: write
  security-events: write

jobs:

  check-if-pr-merged:
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMIT_SHA: ${{ github.event.after }}
    runs-on: ubuntu-latest
    outputs:
      pr-merged: ${{ steps.check.outputs.pr-merged }}
    steps:
      - name: Check if PR merged or direct push
        id: check
        run: |
          PR_LIST=$(gh api repos/${{ github.repository }}/commits/${{ env.COMMIT_SHA }}/pulls)
          PR_COUNT=$(echo "$PR_LIST" | jq length)
          if [ ${{ github.event_name }} == 'pull_request' ]; then
            echo "pr-merged=false" >> $GITHUB_OUTPUT
          elif [ "$PR_COUNT" -gt 0 ]; then
            echo "pr-merged=true" >> $GITHUB_OUTPUT
          else
            echo "pr-merged=false" >> $GITHUB_OUTPUT
          fi
  terraform-static-scan:
    needs: check-if-pr-merged
    if: needs.check-if-pr-merged.outputs.pr-merged == 'false' 
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      - name: Create Terraform Plugin Cache Directory
        run: mkdir -p ${{ github.workspace }}/.terraform.d/plugin-cache
      - name: Cache Terraform Providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-
      - name: Terraform Init and Validate
        run: |
          for dir in ${{ env.TF_DIR }}; do
            echo "=================================================="
            echo "Processing Directory: $dir"
            echo "=================================================="
            
            # Navigate to directory, run commands, and return
            cd "$dir"
            terraform init --backend=false
            terraform validate
            terraform fmt -check -recursive
            cd - > /dev/null
          done
      - name: TfLint Setup
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a
        with:
          tflint_version: 0.64.0
      - name: Tflint Init
        run: tflint --init --config ${{ github.workspace }}/.tflint.hcl
      - name: Run TfLint
        run: tflint --config ${{ github.workspace }}/.tflint.hcl --recursive
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7
        with:
          directory: ${{ github.workspace }}
          soft_fail: false
          download_external_modules: true
          output_format: cli,sarif
          output_file_path: console,checkov-static-scan-results.sarif
      - name: Upload Checkov SARIF results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: checkov-static-scan-results.sarif

  checkov-plan-scan:
    environment: dev
    needs: [check-if-pr-merged, terraform-static-scan]
    if: needs.check-if-pr-merged.outputs.pr-merged == 'false' 
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      - name: Create Terraform Plugin Cache Directory
        run: mkdir -p ${{ github.workspace }}/.terraform.d/plugin-cache
      - name: Cache Terraform Providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: "sts.amazonaws.com"
          role-skip-session-tagging: true
      - name: VPC Init and Plan
        working-directory: ./vpc
        run: |
          terraform init -backend-config="bucket=${{ vars.BACKEND_BUCKET }}" -backend-config="key=${{ vars.VPC_BACKEND_KEY }}"
          terraform plan -var-file=./environment/dev.tfvars -out=tfplan
          terraform show tfplan > tfplan-vpc.txt
          terraform show -json tfplan > tfplan.json
      - name: VPC Checkov Plan Scan
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7
        with:
          file: ./vpc/tfplan.json
          soft_fail: false
          framework: terraform_plan
          output_format: cli,sarif
          output_file_path: console,checkov-vpc-plan-scan-results.sarif
      - name: EKS Init and Plan
        working-directory: ./eks
        run: |
          terraform init -backend-config="bucket=${{ vars.BACKEND_BUCKET }}" -backend-config="key=${{ vars.EKS_BACKEND_KEY }}"
          terraform plan -var-file=./environment/dev.tfvars -out=tfplan
          terraform show tfplan > tfplan-eks.txt
          terraform show -json tfplan > tfplan.json
      - name: EKS Checkov Plan Scan
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7
        with:
          file: ./eks/tfplan.json
          soft_fail: false
          framework: terraform_plan
          output_format: cli,sarif
          output_file_path: console,checkov-eks-plan-scan-results.sarif
      - name: RDS Init and Plan
        working-directory: ./rds
        run: |
          terraform init -backend-config="bucket=${{ vars.BACKEND_BUCKET }}" -backend-config="key=${{ vars.RDS_BACKEND_KEY }}"
          terraform plan -var-file=./environment/dev.tfvars -out=tfplan -var "db_username=${{ secrets.DB_USERNAME }}"
          terraform show tfplan > tfplan-rds.txt
          terraform show -json tfplan > tfplan.json
      - name: RDS Checkov Plan Scan
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7
        with:
          file: ./rds/tfplan.json
          soft_fail: false
          framework: terraform_plan
          output_format: cli,sarif
          output_file_path: console,checkov-rds-plan-scan-results.sarif
      - name: Addons Init and Plan
        working-directory: ./addons
        run: |
          terraform init -backend-config="bucket=${{ vars.BACKEND_BUCKET }}" -backend-config="key=${{ vars.ADDONS_BACKEND_KEY }}"
          terraform plan -var-file=./environment/dev.tfvars -out=tfplan
          terraform show tfplan > tfplan-addons.txt
          terraform show -json tfplan > tfplan.json
      - name: Addons Checkov Plan Scan
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7
        with:
          file: ./addons/tfplan.json
          soft_fail: false
          framework: terraform_plan
          output_format: cli,sarif
          output_file_path: console,checkov-addons-plan-scan-results.sarif
      - name: Upload Checkov SARIF results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: checkov-vpc-plan-scan-results.sarif
      - name: Upload Checkov SARIF results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: checkov-eks-plan-scan-results.sarif
      - name: Upload Checkov SARIF results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: checkov-rds-plan-scan-results.sarif
      - name: Upload Checkov SARIF results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: checkov-addons-plan-scan-results.sarif
      - name: post plan to pr comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@0.9.0
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs');
            const vpcPlan = fs.readFileSync('./vpc/tfplan-vpc.txt', 'utf8');
            const eksPlan = fs.readFileSync('./eks/tfplan-eks.txt', 'utf8');
            const rdsPlan = fs.readFileSync('./rds/tfplan-rds.txt', 'utf8');
            const addonsPlan = fs.readFileSync('./addons/tfplan-addons.txt', 'utf8');
            const commentBody = `### Terraform Plan Results\n\n**VPC Plan:**\n\`\`\`\n${vpcPlan}\n\`\`\`\n\n**EKS Plan:**\n\`\`\`\n${eksPlan}\n\`\`\`\n\n**RDS Plan:**\n\`\`\`\n${rdsPlan}\n\`\`\`\n\n**Addons Plan:**\n\`\`\`\n${addonsPlan}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
  terraform-apply:
    needs: [check-if-pr-merged, checkov-plan-scan, terraform-static-scan]
    if: github.event_name != 'pull_request' && (needs.checkov-plan-scan.result == 'success' || needs.checkov-plan-scan.result == 'skipped') && (needs.terraform-static-scan.result == 'success' || needs.terraform-static-scan.result == 'skipped')
    environment: dev
    name: Terraform Apply
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      - name: Create Terraform Plugin Cache Directory
        run: mkdir -p ${{ github.workspace }}/.terraform.d/plugin-cache
      - name: Cache Terraform Providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: "sts.amazonaws.com"
          role-skip-session-tagging: true
      - name: VPC Init and Apply
        working-directory: ./vpc
        run: |
          terraform init -backend-config="bucket=${{ vars.BACKEND_BUCKET }}" -backend-config="key=${{ vars.VPC_BACKEND_KEY }}"
          terraform apply -auto-approve -var-file=./environment/dev.tfvars
      - name: EKS Init and Apply
        working-directory: ./eks
        run: |
          terraform init -backend-config="bucket=${{ vars.BACKEND_BUCKET }}" -backend-config="key=${{ vars.EKS_BACKEND_KEY }}"
          terraform apply -auto-approve -var-file=./environment/dev.tfvars
      - name: RDS Init and Apply
        working-directory: ./rds
        run: |
          terraform init -backend-config="bucket=${{ vars.BACKEND_BUCKET }}" -backend-config="key=${{ vars.RDS_BACKEND_KEY }}"
          terraform apply -auto-approve -var-file=./environment/dev.tfvars -var "db_username=${{ secrets.DB_USERNAME }}"
      - name: Addons Init and Apply
        working-directory: ./addons
        run: |
          terraform init -backend-config="bucket=${{ vars.BACKEND_BUCKET }}" -backend-config="key=${{ vars.ADDONS_BACKEND_KEY }}"
          terraform apply -auto-approve -var-file=./environment/dev.tfvars